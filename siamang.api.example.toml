# Real proposal-runtime configuration template. No model is downloaded here.
# Replace provider_model with a tag actually installed on your Ollama server.
# Authentication and persistent seal key are environment-owned: docs/HTTP_API.md.

[storage]
path = "data/siamang.db"

[providers.local]
type = "ollama"
base_url = "http://127.0.0.1:11434"
timeout_secs = 120

[models.engineering]
provider = "local"
provider_model = "qwen3:4b-instruct "
capabilities = ["text_generation", "structured_output"]
priority = 10

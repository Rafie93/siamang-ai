[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siamang-ai"
version = "0.3.0"
description = "Siamang: Evidence-Based Autonomous Software Engineering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Runtime is stdlib-only by design (Phase 3 dependency principle).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
siamang = "siamang.cli.main:main"
siamang-api = "siamang.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siamang = ["contracts/examples/*.json", "storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

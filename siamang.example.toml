# Example Siamang configuration. Pass it with --config or SIAMANG_CONFIG.
# Never put secrets here (Phase 3 has no secret settings).
# Every key is optional; env vars SIAMANG_<SECTION>_<KEY> override this file.

[app]
name = "siamang"
environment = "development"   # development | test | production

[storage]
path = "data/siamang.db"      # relative to this file's directory

[logging]
level = "INFO"                # DEBUG | INFO | WARNING | ERROR | CRITICAL
console = true
# file = "logs/siamang.jsonl" # JSON lines; omit to disable file logging

[contract]
version = "0.2"

[router]
health_check = true           # probe provider health while selecting a model

# Providers: one table per provider instance. `type` selects the adapter.
# Phase 06 ships only "echo" (local, deterministic, not an LLM).
# Credentials: name the env var that holds the key (api_key_env); never put
# the key itself in this file.
[providers.local]
type = "echo"
name = "Local echo (wiring test)"
# api_key_env = "SIAMANG_LOCAL_API_KEY"

# Claude through your own logged-in `claude` CLI (subscription, personal use only):
# [providers.claude]
# type = "claude_cli"
# timeout_secs = 300
#
# [models.claude-sonnet]
# provider = "claude"
# provider_model = "sonnet"   # or "opus", "haiku", or a full model ID
# capabilities = ["text_generation", "structured_output"]
# priority = 10

# The model an agent uses (HTTP runs): lead, planner, analyst, programmer, qa, reviewer.
# [agents.programmer]
# model = "claude-sonnet"
# parallel = 3            # work packages at the same time (1-6); more uses subscription limits faster
# ci_repair = 2           # times a failed build returns to the Programmer (0-3); 0 turns it off

# Phase 25-26: run the project's tests and build in a container before a result may pass. Off by default.
# Commands come from here, never from the repository. The container has no network and no secrets, so the image
# must already hold the dependencies (pull it first: podman pull <image>).
# [sandbox]
# enabled = true
# runtime = "podman"          # or "docker"
# image = "python:3.12-slim"
# test_command = "python -m pytest -q"
# build_command = ""
# timeout_secs = 300          # per command
# memory_mb = 1024
# cpus = 1
# verify_attempts = 2         # times a failed check returns to the Programmer (0-3)
# tools = true                # Phase 27: the Programmer edits and runs commands in the sandbox, then proposes
# tool_turns = 12             # tool calls per attempt (1-40); each is one model call
# tool_runs = 6               # commands per attempt (1-20)

# Phase 28: what a run does when delivery fails. Off keeps the plain verify-and-retry loop.
# [recovery]
# enabled = true
# retries = 1                 # tier 1: Programmer again with the failure as feedback (0-3)
# advisor_rounds = 1          # tier 2: the Lead model advises another approach or a split (0-2)
# replans = 1                 # tier 3: plan the remaining work again (0-2)
# max_attempts = 8            # all delivery attempts in one run

# Models: one table per model; the table key is SIAMANG's model_id.
# priority: lower = preferred. Capabilities: text_generation,
# structured_output, tool_calling, vision, streaming, reasoning.
[models.echo-small]
provider = "local"
display_name = "Echo (small)"
capabilities = ["text_generation", "structured_output"]
context_window = 4096
priority = 100
